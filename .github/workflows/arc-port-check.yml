name: Arc source port verification
on:
  push:
    branches: [flow-arc-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify exact imported Arc source
        run: |
          python3 - <<'PYCODE'
          import json, hashlib, pathlib
          root=pathlib.Path('vendor/arc')
          manifest=json.loads((root/'SOURCE.json').read_text())
          for item in manifest['files']:
              assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['sha256'], item['path']
          print('Verified',len(manifest['files']),'unchanged Arc source and test files')
          PYCODE
      - name: Run original Arc policy and connection-choice tests
        run: |
          chmod +x gradlew
          ./gradlew -p vendor/arc-policy test --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-policy-test-results
          path: vendor/arc-policy/build/reports/tests/
          if-no-files-found: ignore
