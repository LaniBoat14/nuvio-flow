name: Flow signed release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flow-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLOW_GITHUB_OWNER: LaniBoat14
      FLOW_GITHUB_REPO: nuvio-flow
      CI_USE_DEBUG_SIGNING: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Integrate newer official release
        if: github.event_name == 'schedule'
        id: upstream
        run: echo "changed=false" >> "$GITHUB_OUTPUT"
      - name: Check for an unpublished Flow update
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          READY=$(gh release view "$TAG" --json isDraft,assets --jq '(.isDraft == false) and (.assets | any(.name == "app-full-armeabi-v7a-release.apk"))' 2>/dev/null || echo false)
          if [ "$READY" = true ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Flow $TAG has no published APK; build and publication are required."
          fi
      - name: Skip unchanged scheduled build
        if: github.event_name == 'schedule' && steps.upstream.outputs.changed == 'false' && steps.pending.outputs.required == 'false'
        run: echo "No newer official release; no publication required."
      - name: Check required source inputs
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || steps.pending.outputs.required == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
              "app/src/full/java/com/nuvio/tv/core/build/AppFeaturePolicy.kt",
              "app/src/main/java/com/nuvio/tv/core/build/TrailerPlaybackMode.kt",
              "app/src/main/res/raw/isrgrootx1.pem",
              "app/src/main/res/raw/isrg_root_x2.pem",
              "gradle/wrapper/gradle-wrapper.jar",
          ]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit("Incomplete source checkout: " + ", ".join(missing))
          print("Required source packages, public certificates and wrapper are present.")
          PY
      - name: Generate localhost TLS test fixture
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || steps.pending.outputs.required == 'true'
        run: |
          mkdir -p app/src/test/resources
          test -f app/src/test/resources/subtitle-redirect-test.p12 || keytool -genkeypair -alias subtitle-test -keyalg RSA -keysize 2048 -validity 3650 -storetype PKCS12 -keystore app/src/test/resources/subtitle-redirect-test.p12 -storepass changeit -keypass changeit -dname "CN=127.0.0.1" -ext "SAN=ip:127.0.0.1"
      - name: Restore private build configuration
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || steps.pending.outputs.required == 'true'
        env:
          FLOW_KEYSTORE_BASE64: ${{ secrets.FLOW_KEYSTORE_BASE64 }}
          FLOW_LOCAL_PROPERTIES_BASE64: ${{ secrets.FLOW_LOCAL_PROPERTIES_BASE64 }}
          FLOW_DEV_PROPERTIES_BASE64: ${{ secrets.FLOW_DEV_PROPERTIES_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64, pathlib, re
          root = pathlib.Path.cwd()
          for secret, filename in [("FLOW_KEYSTORE_BASE64", "flow-signing.keystore"), ("FLOW_LOCAL_PROPERTIES_BASE64", "local.properties")]:
              value = os.environ.get(secret, "")
              if not value: raise SystemExit("Missing repository secret: " + secret)
              path = root / filename
              path.write_bytes(base64.b64decode(value, validate=False))
              path.chmod(0o600)
          dev = os.environ.get("FLOW_DEV_PROPERTIES_BASE64", "")
          if dev:
              path = root / "local.dev.properties"
              path.write_bytes(base64.b64decode(dev, validate=False))
              path.chmod(0o600)
          for filename in ["local.properties", "local.dev.properties"]:
              path = root / filename
              if not path.exists(): continue
              text = path.read_text()
              values = {"DOVI_NATIVE_ENABLED": "true", "DOVI_EXTRACTOR_HOOK_READY": "true", "DOVI_ENABLE_REAL_LINK": "true", "AML_FEL_NATIVE_ENABLED": "true", "sdk.dir": os.environ["ANDROID_HOME"], "NUVIO_RELEASE_STORE_FILE": str(root / "flow-signing.keystore"), "DOVI_LIBDOVI_PREBUILT_ROOT": str(root / "DV7/libdovi")}
              for key, value in values.items():
                  pattern = r"(?m)^[ \t]*" + re.escape(key) + r"[ \t]*=.*$"
                  line = key + "=" + value
                  text = re.sub(pattern, lambda _: line, text) if re.search(pattern, text) else text + "\n" + line + "\n"
              path.write_text(text)
          PY
      - name: Test and assemble optimized Flow
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || steps.pending.outputs.required == 'true'
        run: |
          python3 scripts/verify_arc_runtime.py
          chmod +x gradlew
          ./gradlew :app:testFullReleaseUnitTest --tests "com.nuvio.tv.ui.screens.player.AutoSpeedup*" --tests "com.nuvio.tv.ui.screens.player.ParallelRange*" --tests "com.nuvio.tv.ui.screens.player.Playback*" --tests "com.nuvio.tv.ui.screens.player.HostSpeedsTest" --tests "com.nuvio.tv.ui.screens.player.TvArcAudioOutputTest" --tests "com.nuvio.tv.ui.screens.player.iec.*" --tests "com.nuvio.tv.core.player.*" --tests "com.nuvio.tv.ui.screens.settings.MemoryBudgetTest" --tests "com.nuvio.tv.ui.screens.settings.BufferSettingsNumbersTest" --tests "com.nuvio.tv.ui.screens.settings.ConnectionsChoiceTest" --tests "com.nuvio.tv.updater.*" :app:assembleFullRelease --max-workers=2 --no-daemon --console=plain --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process
      - name: Collect test failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for name in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              root = ET.parse(name).getroot()
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print(case.get('classname'), case.get('name'), failure.text or failure.get('message'))
          PY
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: ignore
      - name: Verify expected Flow APK
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || steps.pending.outputs.required == 'true'
        run: |
          APK=app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk
          test -f "$APK"
          python3 scripts/verify_native_apk.py --abi armeabi-v7a "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.jeffrey.nuvioflow.debug'"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || steps.pending.outputs.required == 'true'
        with:
          name: flow-signed-apk
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified signed Flow release
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true' || steps.pending.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, re
          s = pathlib.Path('app/build.gradle.kts').read_text()
          tag = re.search(r'versionName\s*=\s*"([^"]+)"', s)[1]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('FLOW_RELEASE_TAG=' + tag + '\n')
          PYCODE
          TAG=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; leaving its APK unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Integrate verified upstream for $TAG [skip ci]"
            HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin HEAD:main
          fi
          TARGET=$(git rev-parse HEAD)
          FLAGS=()
          case "$TAG" in *-*) FLAGS+=(--prerelease) ;; esac
          gh release create "$TAG" --target "$TARGET" --draft --title "Nuvio Flow $TAG" --notes "<!-- nuvio-fork-version-code: 2011 --> Signed Flow update. Official source baseline: $(cat .flow/upstream-tag). Exact supplied Arc runtime: networking, prewarm, classic/V2 statistics, matching player AARs, native DV/FEL bridge, IEC audio and thumbnail allocator. Reference hashes validated in CI. Preserves Flow installation and update identity. Device playback checks remain user-run." "${FLAGS[@]}" app/build/outputs/apk/full/release/*.apk
          gh release edit "$TAG" --draft=false
      - name: Remove private inputs
        if: always()
        run: rm -f flow-signing.keystore local.properties local.dev.properties
